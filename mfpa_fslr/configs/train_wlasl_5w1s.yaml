# Local content-deduplicated protocol, shared class pool for 1-shot and 5-shot.
seed: 42
output_dir: outputs/WLASL_60_20_20_A5_5w1s_seed42
data:
  metadata: data/wlasl_60_20_20/metadata.csv
  cache_dir: data/processed_wlasl_farneback
model:
  dimension: 128
  variant: A5
  normalization: group
  regions: [0, 1, 2]
head:
  lambda_part: 1.0
  beta_d: 1.0
  beta_q: 0.5
  tau_alpha: 1.0
  rho: 0.8
  tau_s: 0.2
  detach_alpha: false
training:
  n_way: 5
  k_shot: 1
  queries_per_class: 5
  episodes_per_epoch: 1000
  max_epochs: 100
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  log_every: 100
evaluation:
  val_episodes_file: data/wlasl_60_20_20/episodes/val_5w1s_seed123.json
  val_episodes: 100
  seed: 42
